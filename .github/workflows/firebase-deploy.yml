name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - claude/new-session-bxez3q

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/gcp-key.json"

      - name: Deploy to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
        run: npx firebase-tools deploy --only hosting,firestore:rules --project barbershop-william --non-interactive

      - name: Clean up service account key
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-key.json"
